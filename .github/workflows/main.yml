name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create app and build
        run: |
          flutter create --org com.example --project-name saf_test app
          cp main.dart app/lib/main.dart
          cp MainActivity.kt app/android/app/src/main/kotlin/com/example/saf_test/MainActivity.kt
          cd app
          flutter pub add media_kit media_kit_video media_kit_libs_video
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk

